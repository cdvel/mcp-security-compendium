name: links

on:
  pull_request:
    paths: ["**.md", "data/**", "lychee.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress README.md CVES.md METHODOLOGY.md CONTRIBUTING.md CHANGELOG.md
          fail: true
