# Settings for the link check in .github/workflows/links.yml.
max_concurrency = 8
max_retries = 2
timeout = 30
# 429 is a rate limit (archive.org, GitHub), not a dead link.
accept = ["200..=299", "429"]
exclude = [
  # Returns 403 to automated clients; the entry also links an archived copy.
  '^https://www\.nsa\.gov/',
  # ACM's DOI target returns 403 to automated clients.
  '^https://doi\.org/10\.1145/',
]
